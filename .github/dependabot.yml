# Keeps the GitHub Actions pinned to a full commit SHA (see .github/workflows/) up to date: each pin has its tag in a
# comment and Dependabot proposes the next one as a pull request, which the CI then runs.
# Python dependencies are not listed on purpose: requirements.txt, the Pillow and ruff pins and the browsers move only
# in a change of their own, with the golden and the tests passing (methodology section 15).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

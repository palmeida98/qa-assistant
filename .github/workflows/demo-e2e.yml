# End-to-end specs of the fictional demo against a public practice site (examples/demo/e2e; plan 4.2).
# Not part of CI on purpose: it depends on a third-party site and on three repository secrets, and a pull request from a
# fork never receives secrets, so as a required check it could only be "skipped" -- which reads as coverage that does not
# exist. Here it is run when somebody asks for it (Actions > demo-e2e > Run workflow) or, once the repository variable
# DEMO_E2E_SCHEDULE is "true", every Monday. Without the secrets it FAILS with a clear message: it never looks green
# without having executed a spec.
#
# Prerequisites (Settings > Secrets and variables > Actions):
#   secrets   DEMO_SAUCE_STANDARD_USER, DEMO_SAUCE_LOCKED_OUT_USER, DEMO_SAUCE_PASSWORD (the practice site publishes
#             these demo logins on its own login page; they are kept as secrets so that no credential-like text lives
#             in the repository)
#   variable  DEMO_E2E_SCHEDULE = true   (optional: turns the weekly run on)
name: demo-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: demo-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  demo-e2e:
    # the weekly run is off until DEMO_E2E_SCHEDULE is "true"; a manual run always goes ahead
    if: ${{ github.event_name != 'schedule' || vars.DEMO_E2E_SCHEDULE == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEMO_SAUCE_STANDARD_USER: ${{ secrets.DEMO_SAUCE_STANDARD_USER }}
      DEMO_SAUCE_LOCKED_OUT_USER: ${{ secrets.DEMO_SAUCE_LOCKED_OUT_USER }}
      DEMO_SAUCE_PASSWORD: ${{ secrets.DEMO_SAUCE_PASSWORD }}
    defaults:
      run:
        working-directory: examples/demo/e2e
    steps:
      - name: The secrets must exist
        working-directory: .
        run: |
          missing=""
          for v in DEMO_SAUCE_STANDARD_USER DEMO_SAUCE_LOCKED_OUT_USER DEMO_SAUCE_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=demo-e2e NOT RUN::missing secrets:$missing (Settings > Secrets and variables > Actions)"
            echo "**demo-e2e: NOT RUN** - missing secrets:$missing. No Playwright spec was executed, so there is no end-to-end coverage." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # qa-audit engine for the state audit (docs/qa-audit.md section 22): it connects to the specs' Chromium
      # over CDP, so it only needs the package, not the Playwright browsers for Python
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - working-directory: .
        run: pip install -e .
      - name: Playwright specs
        env:
          QA_AUDIT_CDP_PORT: "9222"
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-report.json
        run: npx playwright test --reporter=list,json
      - name: Executed specs in the summary
        run: |
          expected=$(jq '.stats.expected' "$RUNNER_TEMP/playwright-report.json")
          unexpected=$(jq '.stats.unexpected' "$RUNNER_TEMP/playwright-report.json")
          skipped=$(jq '.stats.skipped' "$RUNNER_TEMP/playwright-report.json")
          echo "**demo-e2e: EXECUTED** - ${expected} spec(s) passed, ${unexpected} failed, ${skipped} skipped." >> "$GITHUB_STEP_SUMMARY"
          test "$expected" -gt 0
      - name: Keep the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright-report.json
          if-no-files-found: ignore
          retention-days: 7

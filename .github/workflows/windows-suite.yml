# The WHOLE unit-test suite on Windows. It is a separate workflow and Windows stays UNCONFIRMED (README, "Validation and CI"): the
# framework is developed and used on macOS.
# - It is NOT part of ci.yml's `ci-status`, so it does not block a merge. Its result is shown as it is: since 11.11.2026 it passes (no
#   known failure is left), but with skips, and a skipped test proves nothing on Windows. The summary lists every skip by reason: the
#   destructive-command guard is a POSIX hook (its tests are skipped here on purpose), the Excel recalculation tests need LibreOffice,
#   which this runner does not have, and a few depend on POSIX features.
# - A failing test still fails the check; a failure that is not in .github/known-failures-windows.txt is reported as NEW (a regression).
#   The list is empty now.
# - The two tests that only exist for Windows run (and are required) in ci.yml, job `windows-only-tests`.
# - Calling Windows supported, or folding this workflow into ci.yml as a required job, is a separate decision: a green run with skips
#   is not evidence for the skipped parts.
name: Windows suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-suite-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-suite:
    name: windows-suite (UNCONFIRMED)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pillow==12.3.0
      - name: Unit tests (the whole suite)
        run: |
          set -o pipefail
          PYTHONUTF8=1 python -m unittest discover -s tests -v 2>&1 | tee unit.log
      - name: Counts, skips and known failures in the summary
        if: ${{ !cancelled() }}
        run: |
          python scripts/ci_test_summary.py unit.log --title "unit tests (tests/, windows-latest)" --known-failures .github/known-failures-windows.txt --banner "Windows is UNCONFIRMED: this check is not part of ci-status, and a skipped test proves nothing on Windows (see the skips below: the destructive-command guard is a POSIX hook and its tests are skipped here)" --allow-skip "needs LibreOffice" --allow-skip "\\(Linux\\)" --allow-skip "fake interpreters are shell scripts" --allow-skip "time.tzset" --allow-skip "no permissions" --allow-skip "guard_destructive is a POSIX hook"
      - name: Keep the log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-log-windows-suite
          path: unit.log
          retention-days: 7

# The framework's CI (plan 4.1): lint, unit tests, secrets and golden test on each pull request and on main.
# The personal denylist does not run here on purpose -- it lives only in the local pre-commit.
# A branch runs once, through its pull request (not also on push), and a newer push cancels the older run (11.8
# pilot: the minutes of a private repository ran out; the repository is public now, where standard runners are free,
# and the rule stays to keep each pull request's checks in one run). main runs every job again after a merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check --output-format github .

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # extra of the visual engine (Pillow): without it the image comparison tests would be skipped
      - run: pip install pillow==12.3.0
      # the counts and the skips (with their reasons) go to the run's summary: "OK" alone hides what was not run
      - name: Unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit.log
      - name: Counts and skips in the summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### unit tests (tests/)"
            grep -E "^(Ran [0-9]+ tests|OK|FAILED)" unit.log | sed 's/^/- /'
            echo
            echo "Skipped, by reason (a skipped test proved nothing):"
            grep -E "\.\.\. skipped" unit.log | sed -E "s/.*\.\.\. skipped //" | sort | uniq -c | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      # only the detect-secrets hook of .pre-commit-config.yaml (same version and baseline)
      - run: pre-commit run detect-secrets --all-files --show-diff-on-failure

  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LibreOffice (recalculation of the golden)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc-nogui
      - run: pip install -r requirements.txt
      - run: python scripts/golden_check.py
      # tests that recalculate real formulas (summary vs direct count), the rebuild of the demo
      # (versioned workbook = builder + batches; plan 7.6) and the real golden's mechanism with fictional
      # data (plan 7.3); in the tests job they are skipped
      # tests.test_qa_ui_runs: its two LibreOffice tests (cases added and results applied through the interface's
      # runner) are skipped in the tests job; the interface is leaving the active scope (docs/development-plan.md),
      # and until its code goes they run here with the recalculation, never silently skipped
      - run: python -m unittest tests.test_summary tests.test_demo_reproducible tests.test_golden_real tests.test_qa_ui_runs -v

  qa-audit-engine:
    # qa-audit engine (plan 8.2): integration tests against the local site, one job per engine in parallel (in
    # series they took 17-19 minutes, about 5-6 per engine). Together the three jobs run every test of the suite:
    # - chromium: the whole discovery with QA_AUDIT_TEST_ENGINES=chromium, so the tests that are not per engine
    #   (CheckOpenPage, ReportInBrowser, and any new one) run here; then the cross-engine CompatibilityRun with the
    #   three engines (skipped in the first command, which has one engine only)
    # - firefox, webkit: only that engine's classes (matrix.classes: -k Firefox, -k Webkit; the test module generates
    #   them as <Engine><Suffix>)
    # An engine that cannot start is a failure (QA_AUDIT_REQUIRE_ENGINES), and a -k that selects nothing exits 5.
    name: qa-audit (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
          - engine: firefox
            classes: Firefox
          - engine: webkit
            classes: Webkit
    env:
      QA_AUDIT_REQUIRE_ENGINES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[visual]
      # the browser downloads take about 10 s of this step and the system libraries the rest: no browser cache
      - name: Playwright browsers
        run: |
          if [ "${{ matrix.engine }}" = chromium ]; then
            python -m playwright install --with-deps chromium firefox webkit
          else
            python -m playwright install --with-deps "${{ matrix.engine }}"
          fi
      - run: qa-audit doctor --no-color
      # xvfb: the manual login method opens the browser visibly (docs/qa-audit.md 20)
      - run: sudo apt-get install -y -q xvfb
      - name: Integration tests (${{ matrix.engine }})
        env:
          QA_AUDIT_TEST_ENGINES: ${{ matrix.engine }}
          CLASSES: ${{ matrix.classes }}
        run: |
          if [ -z "$CLASSES" ]; then
            xvfb-run -a python -m unittest discover -s tests/integration -v
          else
            xvfb-run -a python -m unittest discover -s tests/integration -v -k "$CLASSES"
          fi
      - name: Cross-engine comparison (chromium, firefox, webkit)
        if: matrix.engine == 'chromium'
        env:
          QA_AUDIT_TEST_ENGINES: chromium,firefox,webkit
        run: xvfb-run -a python -m unittest discover -s tests/integration -v -k CompatibilityRun

  qa-audit:
    # one status under the job's former name, whatever the matrix: success only when every engine succeeded
    # (a run cancelled by a newer push is not reported as a failure)
    needs: qa-audit-engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every engine passed
        env:
          RESULT: ${{ needs.qa-audit-engine.result }}
        run: |
          echo "qa-audit-engine: $RESULT"
          test "$RESULT" = success

  install:
    # plan 8.9: clean checkout -> scripts/install.sh -> audit of the local fixture site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/install.sh --with-deps
      - name: audit of the local site (code 1 expected from the planted defects)
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory tests/fixtures/site > /dev/null 2>&1 &
          sleep 2
          set +e
          .venv/bin/qa-audit http://127.0.0.1:8765/ --max-pages 8 --delay-ms 0 --no-color             --output "$RUNNER_TEMP/out" --baseline-dir "$RUNNER_TEMP/baselines"
          code=$?
          set -e
          echo "qa-audit exit code: $code"
          test "$code" = 1
          ls "$RUNNER_TEMP"/out/*/report.html "$RUNNER_TEMP"/out/*/results.json
      # plan F20: the eight skills installed from the clean clone into a temporary folder (never ~/.claude), and the
      # preflight of each on the fictional demo workspace; nothing outside $RUNNER_TEMP is read or written
      - name: Skills sync and preflight (isolated)
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          target="$RUNNER_TEMP/skills"; mkdir -p "$target"
          .venv/bin/python scripts/sync_skills.py --apply --target "$target"
          .venv/bin/python scripts/sync_skills.py --target "$target"
          test "$(ls -d "$target"/*/ | wc -l)" = 8
          for skill in project-context analyze-ticket plan-tests run-tests manage-bugs qa-report checkpoint test-pbi; do
            echo "::group::preflight $skill"
            .venv/bin/python scripts/workspace_select.py preflight --skill "$skill" --workspace examples/demo
            echo "::endgroup::"
          done
          echo "**install: skills synced to a temporary folder and preflight passed for the eight skills on examples/demo.**" >> "$GITHUB_STEP_SUMMARY"

  demo-secrets:
    # the secrets cannot be read in a job's `if:`, so this one only says whether they exist. Without them (a fork's
    # pull request, or a repository that never set them) `demo-e2e` is SKIPPED, shown as such, and never green.
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.check.outputs.present }}
    env:
      DEMO_SAUCE_STANDARD_USER: ${{ secrets.DEMO_SAUCE_STANDARD_USER }}
      DEMO_SAUCE_LOCKED_OUT_USER: ${{ secrets.DEMO_SAUCE_LOCKED_OUT_USER }}
      DEMO_SAUCE_PASSWORD: ${{ secrets.DEMO_SAUCE_PASSWORD }}
    steps:
      - id: check
        run: |
          if [ -z "$DEMO_SAUCE_PASSWORD" ] || [ -z "$DEMO_SAUCE_STANDARD_USER" ] || [ -z "$DEMO_SAUCE_LOCKED_OUT_USER" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=demo-e2e NOT RUN::secrets DEMO_SAUCE_* missing (Settings > Secrets and variables > Actions); no Playwright spec was executed"
            echo "**demo-e2e: NOT RUN** - the DEMO_SAUCE_* secrets are missing; no Playwright spec was executed, so this is not E2E coverage." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  demo-e2e:
    # the demo's N2 regression against the public site (plan 4.2; specs in examples/demo/e2e). Three outcomes, never mixed:
    # skipped (no secrets: nothing ran), failed (a spec failed or none was found), or passed with its counts written
    # to the summary. A passing job always means that specs ran.
    needs: demo-secrets
    if: ${{ needs.demo-secrets.outputs.present == 'true' }}
    runs-on: ubuntu-24.04
    env:
      DEMO_SAUCE_STANDARD_USER: ${{ secrets.DEMO_SAUCE_STANDARD_USER }}
      DEMO_SAUCE_LOCKED_OUT_USER: ${{ secrets.DEMO_SAUCE_LOCKED_OUT_USER }}
      DEMO_SAUCE_PASSWORD: ${{ secrets.DEMO_SAUCE_PASSWORD }}
    defaults:
      run:
        working-directory: examples/demo/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # qa-audit engine for the state audit (docs/qa-audit.md section 22): it connects to the specs' Chromium
      # over CDP, so it only needs the package, not the Playwright browsers for Python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - working-directory: .
        run: pip install -e .
      - name: Playwright specs
        env:
          QA_AUDIT_CDP_PORT: "9222"
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-report.json
        run: npx playwright test --reporter=list,json
      - name: Executed specs in the summary
        run: |
          expected=$(jq '.stats.expected' "$RUNNER_TEMP/playwright-report.json")
          unexpected=$(jq '.stats.unexpected' "$RUNNER_TEMP/playwright-report.json")
          skipped=$(jq '.stats.skipped' "$RUNNER_TEMP/playwright-report.json")
          echo "**demo-e2e: EXECUTED** - ${expected} spec(s) passed, ${unexpected} failed, ${skipped} skipped." >> "$GITHUB_STEP_SUMMARY"
          test "$expected" -gt 0

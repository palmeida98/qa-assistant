# The framework's CI (docs/ci.md), sized for its real use: one person, on macOS, with this repository as a backup and a
# proof of concept. The local pre-commit (denylist, ruff, golden, unit tests) is the first barrier; this is the copy that
# runs off the machine, so a commit made with the hooks skipped, or on a machine without LibreOffice, is still checked.
# - lint-secrets: ruff and detect-secrets (the repository is public: a leaked secret is the worst outcome)
# - tests: the whole unit suite on Linux WITH LibreOffice, so the golden and the recalculation tests run here and no
#   skip is allowed except the tests that exist only for Windows
# - install: a clean clone installs, audits the fixture site and syncs and preflights every skill; only on main and on
#   demand (it is the "resume on another computer" path, methodology 12.3, not something a pull request needs)
# The qa-audit browser tests are a separate workflow (qa-audit.yml) with a path filter. main has no branch protection,
# so no aggregate "required" check is kept. The personal denylist does not run here on purpose: it lives only locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # same versions as .pre-commit-config.yaml
      - run: pip install ruff==0.16.8 pre-commit==4.7.0
      - run: ruff check --output-format github .
      - run: pre-commit run detect-secrets --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LibreOffice (recalculation of the golden)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc-nogui
      # Pillow: the visual engine's extra, without it the image comparison tests would be skipped
      - run: pip install -r requirements.txt pillow==12.3.0
      - name: Excel golden (fictional)
        run: python scripts/golden_check.py
      - name: Unit tests (the whole suite)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit.log
      # counts and skips by reason go to the run summary; a run that executed nothing, or a skip with any reason other
      # than Windows, fails the check: "OK" alone hides what was not run
      - name: Counts and skips in the summary
        if: ${{ !cancelled() }}
        run: python scripts/ci_test_summary.py unit.log --title "unit tests (tests/, ubuntu + LibreOffice)" --allow-skip "Windows"
      - name: Keep the log of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-log
          path: unit.log
          retention-days: 7

  install:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./scripts/install.sh --with-deps
      - name: Audit of the local site (code 1 expected from the planted defects)
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory tests/fixtures/site > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/ && break
            sleep 1
          done
          set +e
          .venv/bin/qa-audit http://127.0.0.1:8765/ --max-pages 8 --delay-ms 0 --no-color --output "$RUNNER_TEMP/out" --baseline-dir "$RUNNER_TEMP/baselines"
          code=$?
          set -e
          echo "qa-audit exit code: $code"
          test "$code" = 1
          ls "$RUNNER_TEMP"/out/*/report.html "$RUNNER_TEMP"/out/*/results.json
      # every skill of .claude/skills synced into a temporary folder (never ~/.claude) and preflighted on the fictional
      # demo workspace; install.sh installs only the qa-audit engine, the skills' scripts need requirements.txt too
      - name: Skills sync and preflight (isolated)
        run: |
          .venv/bin/python -m pip install --quiet -r requirements.txt
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          target="$RUNNER_TEMP/skills"; mkdir -p "$target"
          .venv/bin/python scripts/sync_skills.py --apply --allow-worktree --target "$target"
          .venv/bin/python scripts/sync_skills.py --target "$target"
          expected=$(ls -d .claude/skills/*/ | wc -l)
          test "$(ls -d "$target"/*/ | wc -l)" = "$expected"
          for dir in .claude/skills/*/; do
            skill=$(basename "$dir")
            echo "::group::preflight $skill"
            .venv/bin/python scripts/workspace_select.py preflight --skill "$skill" --workspace examples/demo
            echo "::endgroup::"
          done
          echo "**install: $expected skills synced to a temporary folder and preflighted on examples/demo.**" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the audit report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: install-audit-out
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 7
